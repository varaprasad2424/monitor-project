apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-site
  template:
    metadata:
      labels:
        app: nginx-site
    spec:
      containers:
      - name: nginx-container
        image: nani2424/monitor-static-wesite  # Replace with your actual image
        ports:
        - containerPort: 80
